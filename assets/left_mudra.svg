<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Silhouette Base -->
  <path d="M 90 35
           C 90 35, 75 25, 62 25
           C 50 25, 45 32, 45 32
           C 45 32, 20 32, 16 34
           C 12 36, 12 42, 16 44
           L 46 44
           L 20 46
           C 16 48, 16 54, 20 56
           L 54 56
           C 54 56, 44 58, 44 64
           C 44 70, 54 72, 64 72
           C 74 72, 90 65, 90 50 Z" fill="#06141D" />

  <g fill="none" stroke="#E5A93B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Extended Index Finger pointing left -->
    <path d="M 82 35 C 75 35, 60 34, 52 34 L 16 34 C 12 34, 12 40, 16 40 L 50 40" />
    <!-- Extended Middle Finger pointing left -->
    <path d="M 82 42 L 52 42 L 20 42 C 16 42, 16 48, 20 48 L 56 48" />
    
    <!-- Folded Ring Finger (loop style) -->
    <path d="M 56 48 C 50 48, 44 52, 44 56 C 44 60, 50 60, 56 60" stroke-width="1.8" />
    <!-- Folded Pinky Finger (loop style) -->
    <path d="M 52 60 C 48 60, 42 64, 42 68 C 42 72, 48 72, 54 72 L 72 72" stroke-width="1.8" />
    
    <!-- Thumb (resting on Y=34-40) -->
    <path d="M 70 34 C 65 30, 58 26, 52 28 C 48 30, 52 38, 60 38 C 66 38, 72 35, 72 35" />
    
    <!-- Wrist cuff curves -->
    <path d="M 82 30 C 85 30, 92 35, 92 48 C 92 60, 85 68, 78 68" />
    
    <!-- Gold Bangles on wrist -->
    <rect x="80" y="30" width="3" height="38" rx="1.5" fill="#E5A93B" stroke="none" />
    <rect x="85" y="32" width="2" height="34" rx="1" fill="#E5A93B" stroke="none" opacity="0.8" />
    
    <!-- Henna mandala detail on back of hand -->
    <circle cx="70" cy="50" r="3" fill="#E5A93B" stroke="none" />
  </g>
</svg>
